site_name: "The Grand Annals"
site_url: https://annals.telysta.com/en/
site_author: "Weiser"
site_description: "The future English edition of The Grand Annals."

docs_dir: docs/en
site_dir: site/en
strict: true

extra_css:
  - assets/stylesheets/tokens.css
  - assets/stylesheets/base.css
  - assets/stylesheets/components.css
  - assets/stylesheets/home.css
  - assets/stylesheets/responsive.css

extra_javascript:
  - assets/javascripts/annals.js

nav:
  - Home: index.md
  - World: world/index.md
  - People: human/index.md

theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  generator: false
  alternate:
    - name: 简体中文
      link: /
      lang: zh
    - name: English
      link: /en/
      lang: en

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true
