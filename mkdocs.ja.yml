site_name: "The Grand Annals"
site_url: https://annals.telysta.com/ja/
site_author: "Weiser"
site_description: "The reserved Japanese edition of The Grand Annals."

docs_dir: docs/ja
site_dir: site/ja
strict: true

nav:
  - Home: index.md

theme:
  name: material
  language: ja
  custom_dir: overrides
  features:
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight

extra:
  generator: false

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
