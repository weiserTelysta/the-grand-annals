site_name: "The Grand Annals"
site_url: https://annals.telysta.com/ja/
site_author: "Weiser"
site_description: "The reserved Japanese edition of The Grand Annals."

docs_dir: docs/ja
site_dir: site/ja
strict: true

extra_css:
  - assets/stylesheets/tokens.css
  - assets/stylesheets/base.css
  - assets/stylesheets/components.css
  - assets/stylesheets/home.css
  - assets/stylesheets/responsive.css

extra_javascript:
  - assets/javascripts/annals.js

nav:
  - Home: index.md

theme:
  name: material
  language: ja
  custom_dir: overrides
  features:
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替える

extra:
  generator: false
  alternate:
    - name: 简体中文
      link: /
      lang: zh
    - name: English
      link: /en/
      lang: en
    - name: 日本語
      link: /ja/
      lang: ja

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
