name: deploy-docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate authored content
        run: python tools/validate_content.py

      - name: Build Chinese site
        run: mkdocs build --strict --clean --config-file mkdocs.yml

      - name: Validate generated site
        run: python tools/validate_site.py site

      - name: Validate responsive layout
        shell: bash
        run: |
          python -m http.server 8765 --directory site >/tmp/annals-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python tools/validate_layout.py --base-url http://127.0.0.1:8765/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: true
          cname: annals.telysta.com
