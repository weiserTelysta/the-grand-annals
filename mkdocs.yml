site_name: "龙冠枯荣"
site_url: https://annals.telysta.com/
site_author: "Weiser"
site_description: "《龙冠枯荣》是一部以架空文明史、世界法则与人物命运为核心的中文幻想纪年。"

docs_dir: docs/zh
site_dir: site
strict: true
exclude_docs: |
  404.md
  assets/character art/Telysta/*.png
  assets/illustration/Telysta&Losalind_Library_day_01.webp
  assets/illustration/Telysta&Losalind_Library_day_02.webp
  assets/illustration/Telysta&Losalind_Library_night_01.webp
  assets/illustration/Telysta&Losalind_Library_night_02.webp
  assets/images/social-card.png

extra_css:
  - assets/stylesheets/tokens.css
  - assets/stylesheets/base.css
  - assets/stylesheets/components.css
  - assets/stylesheets/home.css
  - assets/stylesheets/responsive.css

extra_javascript:
  - assets/javascripts/annals.js

theme:
  name: material
  language: zh
  font: false
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  icon:
    logo: material/book-open-page-variant

extra:
  generator: false

copyright: "© Weiser · 龙冠枯荣 / The Grand Annals"

plugins:
  - meta
  - search:
      lang: zh
  - awesome-nav
  - callouts
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
      draggable: true

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - abbr
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.blocks.admonition:
      types:
        - note
        - abstract
        - info
        - tip
        - success
        - question
        - warning
        - failure
        - danger
        - bug
        - example
        - quote
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      toc_depth: 4

hooks:
  - tools/mkdocs_hooks.py
