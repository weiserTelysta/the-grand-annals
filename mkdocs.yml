site_name: "The Grand Annals"
site_url: https://annals.telysta.com/
site_author: "Weiser"
site_description: "A world of epic fantasy"

docs_dir: docs/zh 
site_dir: site

repo_name: "the-grand-annals"
repo_url: "https://github.com/weiserTelysta/the-grand-annals"

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - stylesheets/extra.js

theme:
  name: material
  language: zh
  features:
    - toc.follow
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy
    - navigation.top
    - content.tooltips

  custom_dir: overrides # 用于覆盖 Material 主题的默认模板和样式
    
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red       
      accent: red
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

  icon:
    logo: material/library

extra:
  alternate:
    - name: 简体中文
      link: / 
      lang: zh
    - name: English
      link: /en/
      lang: en
    - name: 日本語
      link: /ja/
      lang: ja

plugins:
  - search
  - awesome-pages:
      collapse_single_pages: false
  - roamlinks
  - glightbox:
      touchNavigation: true   # 支持手机端触摸滑动
      loop: false             # 是否循环播放文件夹内的图片
      zoomable: true          # 是否允许缩放（非常适合看大地图）
      draggable: true         # 是否允许鼠标拖动

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.blocks.admonition:
      types:
        - note
        - abstract
        - info
        - tip
        - success
        - question
        - warning
        - failure
        - danger
        - bug
        - example
        - quote
  - pymdownx.details
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - abbr
  - toc:
      permalink: true
      toc_depth: 6