site_name: "龙冠枯荣"
site_url: https://annals.telysta.com/
site_author: "Weiser"
site_description: "《龙冠枯荣》是一部以架空文明史、世界法则与人物命运为核心的中文幻想世界档案。"

docs_dir: docs/zh
site_dir: site
strict: true
not_in_nav: |
  404.md
exclude_docs: |
  assets/character art/Telysta/*.png

repo_name: "the-grand-annals"
repo_url: "https://github.com/weiserTelysta/the-grand-annals"

nav:
  - 首页: index.md
  - 开始阅读: 开始阅读/index.md
  - 世界与法则:
      - 世界总览:
          - 总览: 世界总览/index.md
          - 世界基础: 世界总览/世界基础.md
      - 法则设定:
          - 序言: 法则设定/index.md
          - 魔法体系:
              - 导言: 法则设定/魔法体系/index.md
              - 魔法体系: 法则设定/魔法体系/魔法体系.md
  - 山河与诸邦:
      - 山河地理:
          - 序言: 山河地理/index.md
          - 长域: 山河地理/地理名词/长域.md
      - 文明诸邦: 文明诸邦/index.md
  - 历史与纪元: 历史纪元/index.md
  - 众生与人物:
      - 众生谱系: 众生谱系/index.md
      - 星辰微光:
          - 章节介绍: 星辰微光/index.md
          - 塞勒林家族:
              - 特莉丝塔·塞勒林: 星辰微光/塔莫拉广域/埃瑟穆大区/塞勒林大公爵领地/塞勒林家族/特莉丝塔·塞勒林.md
              - 蕾莉萨·塞勒林: 星辰微光/塔莫拉广域/埃瑟穆大区/塞勒林大公爵领地/塞勒林家族/蕾莉萨·塞勒林.md
  - 条目索引: 索引/index.md

extra_css:
  - stylesheets/tokens.css
  - stylesheets/base.css
  - stylesheets/components.css
  - stylesheets/home.css
  - stylesheets/responsive.css

extra_javascript:
  - stylesheets/extra.js

theme:
  name: material
  language: zh
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  icon:
    logo: material/book-open-page-variant

extra:
  generator: false

copyright: "© Weiser · 龙冠枯荣 / The Grand Annals"

plugins:
  - search:
      lang: zh
  - callouts
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
      draggable: true

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - abbr
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.blocks.admonition:
      types:
        - note
        - abstract
        - info
        - tip
        - success
        - question
        - warning
        - failure
        - danger
        - bug
        - example
        - quote
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      toc_depth: 4
